<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurin Polla</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(180deg, #0f0c29, #302b63, #24243e);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        overflow: hidden;
        text-align: center;
    }

    /* Particle background */
    .particles {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .container {
        position: relative;
        z-index: 1;
        background: rgba(0,0,0,0.65);
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 0 60px rgba(0,0,0,0.6);
        max-width: 600px;
        animation: fadeIn 2s ease forwards;
    }

    h1 {
        font-family: 'Montserrat', sans-serif;
        font-size: 3rem;
        margin-bottom: 15px;
        letter-spacing: 2px;
    }

    p {
        font-size: 1.2rem;
        margin: 10px 0;
    }

    .quote {
        font-style: italic;
        color: #ccc;
        margin: 20px 0;
        font-size: 1.1rem;
        animation: pulse 2s infinite;
    }

    .highlight {
        font-weight: 700;
        color: #ff6f61;
    }

    @keyframes fadeIn {
        from { opacity:0; transform: translateY(20px);}
        to { opacity:1; transform: translateY(0);}
    }

    @keyframes pulse {
        0% { color: #ccc; }
        50% { color: #ff6f61; }
        100% { color: #ccc; }
    }
</style>
</head>
<body>
<canvas class="particles"></canvas>

<div class="container">
    <h1>Laurin Polla</h1>
    <p>Born on: December 22, 2009</p>
    <p class="quote">"Life in silence"</p>
    <p>Remember my name: <span class="highlight">Laurin Polla</span></p>
</div>

<script>
// Simple particle effect for mysterious aura
const canvas = document.querySelector('.particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray;

class Particle {
    constructor(x,y,size,weight) {
        this.x = x;
        this.y = y;
        this.size = size;
        this.weight = weight;
    }
    draw() {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
    update() {
        this.y += this.weight;
        this.x += Math.sin(this.y * 0.01) * 2;
        if(this.y > canvas.height) {
            this.y = 0 - this.size;
            this.x = Math.random() * canvas.width;
        }
        this.draw();
    }
}

function init() {
    particlesArray = [];
    for(let i=0;i<150;i++){
        let size = Math.random()*3 + 1;
        let x = Math.random() * canvas.width;
        let y = Math.random() * canvas.height;
        let weight = Math.random()*1 + 0.5;
        particlesArray.push(new Particle(x,y,size,weight));
    }
}
init();

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<particlesArray.length;i++){
        particlesArray[i].update();
    }
    requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize',function(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
});
</script>

</body>
</html>
