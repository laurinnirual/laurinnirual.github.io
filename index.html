<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laurin Polla</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        h1:hover {
            transform: scale(1.05);
        }

        p {
            font-size: 1.2rem;
            margin: 0.5em 0;
            line-height: 1.6;
        }

        .quote {
            font-style: italic;
            color: #ffd700;
            font-size: 1.3rem;
            margin-top: 1.5rem;
            transition: color 0.3s ease;
        }

        .quote:hover {
            color: #ffffff;
        }

        .highlight {
            font-weight: bold;
            color: #ffeb3b;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        /* Kontakt-Button */
        .contact-button {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #6a11cb;
            background-color: #ffeb3b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contact-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        footer {
            position: absolute;
            bottom: 1rem;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }

            p {
                font-size: 1rem;
            }

            .quote {
                font-size: 1.1rem;
            }

            .contact-button {
                font-size: 1rem;
                padding: 0.6rem 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Laurin Polla</h1>
        <p>Geboren am: 22.12.2009</p>
    </header>
    <main>
        <p class="quote">"Life in silence"</p>
        <p>Merkt euch meinen Namen: <span class="highlight">Laurin Polla</span></p>
        <a href="mailto:laurin.polla@yahoo.com" class="contact-button">Kontakt</a>
    </main>
    <footer>
        &copy; 2025 Laurin Polla. Alle Rechte vorbehalten.
    </footer>
</body>
</html>
