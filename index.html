<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurin Polla</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #0d0d0d, #2e2e2e);
    color: #fff;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
}

/* Animated smoke overlay */
.smoke {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: url('https://images.unsplash.com/photo-1504198453319-5ce911bafcde?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') no-repeat center center;
    background-size: cover;
    opacity: 0.08;
    animation: drift 60s linear infinite;
    z-index:0;
}

@keyframes drift {
    0% { transform: translateX(0) translateY(0) scale(1);}
    50% { transform: translateX(30px) translateY(-20px) scale(1.05);}
    100% { transform: translateX(0) translateY(0) scale(1);}
}

.container {
    position: relative;
    z-index:1;
    background: rgba(0,0,0,0.75);
    padding: 80px 70px;
    border-radius: 30px;
    max-width: 750px;
    width: 90%;
    box-shadow: 0 20px 70px rgba(0,0,0,0.7);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.container:hover {
    transform: scale(1.04);
    box-shadow: 0 30px 100px rgba(0,0,0,0.8);
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    margin-bottom: 25px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 2px 2px 10px rgba(255,255,255,0.1);
}

p {
    font-size: 1.5rem;
    margin: 15px 0;
}

.quote {
    font-style: italic;
    color: #ccc;
    margin: 30px 0;
    min-height: 50px;
    font-size: 1.4rem;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.highlight {
    font-weight: 700;
    color: #bbb;
}

.btn {
    margin-top: 20px;
    margin-right: 10px;
    margin-left: 10px;
    padding: 16px 35px;
    background: transparent;
    border: 2px solid #fff;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    border-radius: 12px;
    transition: all 0.3s ease;
}

.btn:hover {
    background: #fff;
    color: #000;
}

.email {
    margin-top: 25px;
    font-weight: 500;
    color: #bbb;
    display: none;
    cursor: pointer;
    word-break: break-all;
    font-size: 1.3rem;
}

/* Social Buttons Container */
.social-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 20px;
}

/* Footer styling */
footer {
    margin-top: 40px;
    font-size: 0.9rem;
    color: #aaa;
    text-align: center;
    z-index: 1;
    position: relative;
}
</style>
</head>
<body>

<div class="smoke"></div>

<div class="container">
    <h1>Laurin Polla</h1>
    <p>Born on: December 22, 2009</p>
    <p class="quote" id="quote">"Life in silence"</p>
    <p>Remember my name: <span class="highlight">Laurin Polla</span></p>

    <div class="social-buttons">
        <button class="btn" onclick="showEmail()">Contact</button>
        <button class="btn" onclick="window.open('https://www.instagram.com/laurin.sgg','_blank')">Instagram</button>
    </div>

    <p class="email" id="email" onclick="copyEmail()">laurin.polla@yahoo.com</p>
</div>

<footer>
    &copy; 2025 Laurin Polla. All rights reserved.
</footer>

<script>
/* Quote Rotation */
const quotes = [
    '"Life in silence"',
    '"The new devil is cheap dopamine."',
    '"The future belongs to those who believe in the beauty of their dreams."',
    '"Out there, anything is possible."'
];

let quoteIndex = 0;
const quoteEl = document.getElementById('quote');

function rotateQuote() {
    quoteEl.style.opacity = 0;
    setTimeout(() => {
        quoteEl.textContent = quotes[quoteIndex];
        quoteEl.style.opacity = 1;
        quoteIndex = (quoteIndex + 1) % quotes.length;
    }, 800);
}

rotateQuote();
setInterval(rotateQuote, 10000);

/* Contact email reveal and copy */
function showEmail(){
    const email=document.getElementById('email');
    email.style.display=email.style.display==='block'?'none':'block';
}
function copyEmail(){
    const email=document.getElementById('email').textContent;
    navigator.clipboard.writeText(email);
    alert('Email copied to clipboard!');
}
</script>

</body>
</html>
