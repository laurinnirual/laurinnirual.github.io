<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurin Polla</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #1a1a1a, #4d4d4d);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }

    .container {
        background: rgba(0,0,0,0.75);
        padding: 70px 60px;
        border-radius: 25px;
        max-width: 700px;
        width: 90%;
        box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        text-align: center;
        animation: fadeIn 2s ease forwards;
        transition: transform 0.3s ease;
    }

    .container:hover { transform: scale(1.03); }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 3.5rem;
        margin-bottom: 20px;
        letter-spacing: 2px;
        transition: color 0.5s;
    }

    h1:hover { color: #bbb; }

    p {
        font-size: 1.4rem;
        margin: 15px 0;
        transition: color 0.5s;
    }

    p:hover { color: #ccc; }

    .quote {
        font-style: italic;
        color: #ccc;
        margin: 25px 0;
        min-height: 40px;
        transition: color 0.5s, transform 0.5s;
    }

    .highlight {
        font-weight: 700;
        color: #bbb;
        transition: color 0.3s;
    }

    .btn {
        margin-top: 30px;
        padding: 15px 30px;
        background: transparent;
        border: 2px solid #fff;
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        border-radius: 10px;
        transition: all 0.3s ease;
    }

    .btn:hover {
        background: #fff;
        color: #000;
    }

    .email {
        margin-top: 20px;
        font-weight: 500;
        color: #bbb;
        display: none;
        word-break: break-all;
        cursor: pointer;
    }

    @keyframes fadeIn { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform: translateY(0);} }
</style>
</head>
<body>

<div class="container">
    <h1>Laurin Polla</h1>
    <p>Born on: December 22, 2009</p>
    <p class="quote" id="quote">"Life in silence"</p>
    <p>Remember my name: <span class="highlight">Laurin Polla</span></p>

    <button class="btn" onclick="showEmail()">Contact</button>
    <p class="email" id="email" onclick="copyEmail()">laurin.polla@yahoo.com</p>
</div>

<script>
/* Quote Rotation - Only User's Quotes */
const quotes = [
    '"Life in silence"',
    '"The new devil is cheap dopamine."',
    '"The future belongs to those who believe in the beauty of their dreams."',
    '"Out there, anything is possible."'
];

let quoteIndex = 0;
setInterval(() => {
    const quoteEl = document.getElementById('quote');
    quoteEl.style.opacity = 0;
    setTimeout(() => {
        quoteEl.textContent = quotes[quoteIndex];
        quoteEl.style.opacity = 1;
    }, 500);
    quoteIndex = (quoteIndex + 1) % quotes.length;
}, 8000); // 8 seconds per quote

/* Email Reveal and Copy */
function showEmail(){
    const email=document.getElementById('email');
    email.style.display=email.style.display==='block'?'none':'block';
}
function copyEmail(){
    const email=document.getElementById('email').textContent;
    navigator.clipboard.writeText(email);
    alert('Email copied to clipboard!');
}
</script>

</body>
</html>
