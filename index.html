<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laurin Polla</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 0.2em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 1.5em;
            margin: 0.5em 0;
            color: #fff;
        }

        .quote {
            font-style: italic;
            margin-top: 1em;
            font-size: 1.2em;
        }

        .highlight {
            font-weight: bold;
            color: #ffeb3b;
        }
    </style>
</head>
<body>
    <h1>Laurin Polla</h1>
    <p>Geboren am: 22.12.2009</p>
    <p class="quote">"Life in silence"</p>
    <p>Merkt euch meinen Namen: <span class="highlight">Laurin Polla</span></p>
</body>
</html>
