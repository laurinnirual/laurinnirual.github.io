<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laurin Polla</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #000000, #434343);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }

    .container {
        background: rgba(0,0,0,0.75);
        padding: 50px 40px;
        border-radius: 20px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        margin-bottom: 15px;
        letter-spacing: 2px;
    }

    p {
        font-size: 1.2rem;
        margin: 10px 0;
    }

    .quote {
        font-style: italic;
        color: #ccc;
        margin: 20px 0;
    }

    .highlight {
        font-weight: 700;
        color: #bbb;
    }

    /* Contact button */
    .btn {
        margin-top: 25px;
        padding: 12px 25px;
        background: transparent;
        border: 2px solid #fff;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
    }

    .btn:hover {
        background: #fff;
        color: #000;
    }

    /* Email reveal */
    .email {
        margin-top: 15px;
        font-weight: 500;
        color: #bbb;
        display: none;
        word-break: break-all;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Laurin Polla</h1>
    <p>Born on: December 22, 2009</p>
    <p class="quote">"Life in silence"</p>
    <p>Remember my name: <span class="highlight">Laurin Polla</span></p>

    <button class="btn" onclick="showEmail()">Contact</button>
    <p class="email" id="email">laurin.polla@yahoo.com</p>
</div>

<script>
    function showEmail() {
        const email = document.getElementById('email');
        email.style.display = email.style.display === 'block' ? 'none' : 'block';
    }
</script>
</body>
</html>
